# Four-node production candidate: pure-single ~3.86B MMDiT with Self-Flow.
# BS12 keeps the validated no-reshard path above 80% memory without BS13's
# ~98.6% single-node reservation, leaving room for multi-node NCCL buffers.
model:
  architecture: mmdit
  hidden_size: 3072
  num_layers: 0
  num_double_layers: 0
  num_single_layers: 30
  num_heads: 24
  latent_channels: 32
  patch_size: 2
  rope_theta: 2000.0
  guidance_embeds: false
  flex_attention: true
  alpha_on: false
  vae: {backend: diffusers, pretrained: /mnt/data/users/wfz/checkpoints/black-forest-labs/FLUX.2-dev, subfolder: vae, trainable: false}
  qwen_vl: {backend: transformers, pretrained: /mnt/data/share/checkpoints/Qwen/Qwen3.5-4B, trainable: false, max_length: 1024}
  transformer: {backend: random, trainable: true}
  self_flow:
    enabled: true
    coeff: 0.8
    ema_decay: 0.9999
    # Scale the paper's layer selection to this 30-layer 3.86B model: 9 -> 21.
    student_depth_ratio: 0.3
    teacher_depth_ratio: 0.7
    mask_ratio: 0.25
    timestep_mode: independent
data:
  dataset: tar
  # Shard-level split; eval-v1 holdout shards are never read by training.
  root: /mnt/oss/uv3-pretrain-manifect/0803-test/eval-v1/train_manifest.jsonl
  image_size: 256
  # Keep roughly 256^2 pixels while preserving common source aspect ratios.
  # Aspect is selected rank-locally; only the five text+260 joint lengths are
  # globally scheduled, so no independence assumption or aspect weights remain.
  bucket: true
  aspect_buckets: [square, landscape, portrait, widescreen, phone]
  resolution_stride: 16
  online_joint_bucketing: true
  tokenize_batch_size: 256
  bucket_buffer_max_samples: 8192
  decode_workers: 4
  decode_prefetch_batches: 2
  caption_field: caption_qwen3_7_flash
  num_workers: 4
train:
  fsdp2: true
  fsdp_text_encoder: false
  num_replicate: 1
  num_shard: 8
  reshard_after_forward: false
  mixed_precision: bf16
  compile: true
  compile_text_encoder: true
  text_encoder_compile_mode: default
  compile_vae: true
  # Multiple HxW graphs are safe, but CUDA Graph capture is not: the previous
  # resume crashed inside cudagraph_trees on the first landscape batch.
  vae_compile_mode: max-autotune-no-cudagraphs
  compile_dynamic: false
  compile_mode: default
  text_length_buckets: [512, 640, 768, 896, 1024]
  # Qwen3.5-4B tokenizer distribution measured on 50k production captions.
  # Demand CDF [20,38,56,70]% stays below measured supply CDF
  # [22.08,41.05,60.54,75.39]%; the 30% max-length share drains long-caption
  # backlog without additional dropping beyond the configured 1024-token
  # truncation. The previous [23,21,20,15,21] mix was infeasible and inevitably
  # filled the descriptor buffer.
  text_length_bucket_weights: [20, 18, 18, 14, 30]
  pad_text_to_max_length: false
  flex_attention: true
  block_size: 128
  batch_size_per_gpu: 12
  grad_accum: 1
  # Production runs are at least 100K steps. The launcher injects the same
  # explicit MAX_STEPS on every node; this value is also safe for direct runs.
  max_steps: 100000
  grad_clip: 1.0
  ckpt_every: 1000
  output_dir: /mnt/oss/users/wfz/uv3-codebase-runs
  # The launcher requires and injects one identical RUN_NAME on every node.
  run_name: train_pure_single_4b_self_flow_4node
  wandb: false
  log_every: 10
  seed: 42
  # Both Self-Flow timesteps are sampled independently from the same unshifted
  # Logit-Normal distribution.
  timestep_strategy: logit_normal
  timestep_logit_mean: 0.0
  timestep_logit_std: 1.0
  timestep_metrics: true
  optimizer:
    optimizer: adamw
    muon_lr: 1.0e-4
    muon_momentum: 0.95
    muon_nesterov: true
    muon_ns_steps: 5
    muon_rms_scale: true
    muon_weight_decay: 0.0
    adam_lr: 1.0e-4
    adam_betas: [0.9, 0.95]
    adam_eps: 1.0e-8
    adam_weight_decay: 0.0
    adam_fused: false
