# Four-node production candidate: pure-single ~3.86B MMDiT with Self-Flow.
# BS12 keeps the validated no-reshard path above 80% memory without BS13's
# ~98.6% single-node reservation, leaving room for multi-node NCCL buffers.
model:
  architecture: mmdit
  hidden_size: 3072
  num_layers: 0
  num_double_layers: 0
  num_single_layers: 30
  num_heads: 24
  latent_channels: 32
  patch_size: 2
  rope_theta: 2000.0
  guidance_embeds: false
  flex_attention: true
  alpha_on: false
  vae: {backend: diffusers, pretrained: /mnt/data/users/wfz/checkpoints/black-forest-labs/FLUX.2-dev, subfolder: vae, trainable: false}
  qwen_vl: {backend: transformers, pretrained: /mnt/data/share/checkpoints/Qwen/Qwen3.5-9B, trainable: false, max_length: 1024}
  transformer: {backend: random, trainable: true}
  self_flow:
    enabled: true
    coeff: 1.0
    ema_decay: 0.9999
    student_depth: 0
    teacher_depth: -1
    mask_ratio: 0.5
    ratio: 0.5
    timestep_mode: ratio
data:
  dataset: tar
  # Shard-level split; eval-v1 holdout shards are never read by training.
  root: /mnt/oss/uv3-pretrain-manifect/0803-test/eval-v1/train_manifest.jsonl
  image_size: 256
  # Keep roughly 256^2 pixels while preserving common source aspect ratios.
  # Weights are percentages from a 432,687-row sample of this manifest
  # (2026-08-06); matching the source distribution bounds queue growth.
  bucket: true
  aspect_buckets: [square, landscape, portrait, widescreen, phone]
  aspect_bucket_weights: [19, 37, 14, 26, 4]
  resolution_stride: 16
  caption_field: caption_qwen3_7_flash
  num_workers: 4
train:
  fsdp2: true
  fsdp_text_encoder: false
  num_replicate: 1
  num_shard: 8
  reshard_after_forward: false
  mixed_precision: bf16
  compile: true
  compile_text_encoder: true
  text_encoder_compile_mode: default
  compile_vae: true
  vae_compile_mode: max-autotune
  compile_dynamic: false
  compile_mode: default
  text_length_buckets: [512, 640, 768, 896, 1024]
  text_length_bucket_weights: [5, 4, 4, 3, 4]
  pad_text_to_max_length: false
  flex_attention: true
  block_size: 128
  batch_size_per_gpu: 12
  grad_accum: 1
  # The launcher requires and injects an explicit MAX_STEPS on every node.
  max_steps: 1000
  grad_clip: 1.0
  ckpt_every: 1000
  output_dir: /mnt/oss/users/wfz/uv3-codebase-runs
  # The launcher requires and injects one identical RUN_NAME on every node.
  run_name: train_pure_single_4b_self_flow_4node
  wandb: false
  log_every: 10
  seed: 42
  timestep_strategy: logit_normal
  timestep_logit_mean: 0.0
  timestep_logit_std: 1.0
  timestep_metrics: true
  optimizer:
    optimizer: adamw
    muon_lr: 1.0e-4
    muon_momentum: 0.95
    muon_nesterov: true
    muon_ns_steps: 5
    muon_rms_scale: true
    muon_weight_decay: 0.0
    adam_lr: 1.0e-4
    adam_betas: [0.9, 0.95]
    adam_eps: 1.0e-8
    adam_weight_decay: 0.0
    adam_fused: false
