evaluation:
  # The optimized student is the deliverable model. Self-Flow EMA is a
  # training target and is evaluated only in explicitly named auxiliary runs.
  weights: student
  interval_steps: 1000
  enabled_after_step: 1000
  async_when_gpu_available: true
  sample_steps: 30
  image_size: 256
  # Fixed visual cases follow their source aspect using the same buckets as
  # training. FID/KID remain square below so historical curves stay comparable.
  fixed_aspect_buckets: [square, landscape, portrait, widescreen, phone]
  fixed_cases_manifest: /mnt/oss/uv3-pretrain-manifect/0803-test/eval-v1/fixed_cases_v2.jsonl
  holdout_manifest: /mnt/oss/uv3-pretrain-manifect/0803-test/eval-v1/holdout_manifest.jsonl
  fixed_cases:
    train: 16
    heldout: 16
  distribution_metrics:
    image_size: 256
    num_generated: 10000
    metrics: [fid, kid, clipscore]
    # BS13 can OOM on an unusually long caption while FlexAttention builds its
    # block mask. BS12 retains most throughput with several GiB of headroom.
    batch_size_per_gpu: 12
    # Metrics run after the generation models are released. Keep CLIP/Inception
    # batches conservative because all 10k feature states are retained for KID.
    metrics_batch_size_per_gpu: 4
    clip_model_path: /mnt/data/share/checkpoints/openai-mirror/clip-vit-base-patch32
  schedule_later:
    interval_steps: 2000
    note: Increase further after curves become smooth; no code change required.
