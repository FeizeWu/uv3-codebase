# Production training config: 7B MMDiT, 8x H20 FSDP2, real Qwen3.5-9B text, parquet + bucket + interleave.
# Launch: CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7 bash scripts/launch_train.sh configs/train_real.yaml
model:
  architecture: mmdit
  hidden_size: 4096
  num_layers: 4
  num_double_layers: 4
  num_single_layers: 24
  num_heads: 32
  latent_channels: 32
  patch_size: 2
  in_channels: 128
  out_channels: 128
  rope_theta: 2000.0
  guidance_embeds: false
  flex_attention: true
  alpha_on: false
  vae: {backend: diffusers, pretrained: /mnt/data/share/checkpoints/black-forest-labs/FLUX.2-dev, subfolder: vae, trainable: false}
  qwen_vl: {backend: transformers, pretrained: /mnt/data/share/checkpoints/Qwen/Qwen3.5-9B, trainable: false}
  transformer: {backend: random, trainable: true}
  self_flow: {enabled: false, coeff: 1.0, ema_decay: 0.9999}  # set enabled: true after EMA×FSDP2 wired
data:
  dataset: parquet
  root: /mnt/oss/users/lzj/imagenet-ablation/imagenet-1k   # replace with UV3 crawled parquet
  split: train
  parquet_glob: "data/train-*.parquet"
  image_field: image
  caption_field: text
  image_size: 256
  bucket: true
  aspect_buckets: mar_256
  resolution_stride: 16
  alpha: false
  it2i_mix: 0.0          # >0 to enable it2i edit pairs (set it2i_parquet too)
  it2i_parquet: null
  num_workers: 4
  overfit_n: null
  label_field: label
train:
  fsdp2: true
  sharding_strategy: FULL_SHARD
  num_replicate: 1
  mixed_precision: bf16
  reshard_after_forward: true
  compile: true
  compile_text_encoder: true
  compile_dynamic: false
  compile_mode: default
  flex_attention: true
  block_size: 128
  batch_size_per_gpu: 4
  grad_accum: 8           # effective batch = 8 GPUs * 4 * 8 = 256 (good MFU)
  max_steps: 100000
  grad_clip: 1.0
  ckpt_every: 2000
  output_dir: /mnt/oss/users/wfz/uv3-codebase-runs
  run_name: train_7b_real
  wandb: false
  log_every: 10
  seed: 42
  optimizer:
    optimizer: muon_adam
    muon_lr: 1.0e-4
    muon_momentum: 0.95
    muon_nesterov: true
    muon_ns_steps: 5
    muon_rms_scale: true
    muon_weight_decay: 0.0
    adam_lr: 1.0e-4
    adam_betas: [0.9, 0.95]
    adam_eps: 1.0e-8
    adam_weight_decay: 0.0
